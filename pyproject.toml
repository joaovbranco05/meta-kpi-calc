[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-kpi-calculator"
version = "0.1.0"
description = "API local e painel de KPIs para campanhas Meta"
requires-python = ">=3.12,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

